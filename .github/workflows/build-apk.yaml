name: Android Build BiliPink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  P4A_USE_CERTIFI: 0
  P4A_ALLOW_TLS_13: 1
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 💥 Purge old buildozer cache FIRST
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.buildozer
          rm -rf $ANDROID_HOME

      - name: Download Android SDK Command‑line Tools & Accept ALL Licenses
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076798_latest.zip
          unzip -q commandlinetools-linux-11076798_latest.zip
          mv cmdline-tools latest || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "platforms;android-33" "platform-tools"

      - name: Cache fresh Buildozer SDK & NDK
        uses: actions/cache@v4
        with:
          path: [~/.buildozer, ${{ github.workspace }}/android-sdk]
          key: bilipink-fixed-sdk-${{ github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt -y install automake libltdl-dev zip unzip openjdk-17-jdk git pkg-config libffi-dev libssl-dev autoconf

      - name: Install fixed python packages
        run: |
          python -m pip install --upgrade pip
          pip install Cython==3.0.11 buildozer==1.5.0 certifi
          pip install git+https://github.com/kivy/python-for-android.git@v2024.12

      - name: Print versions
        run: |
          buildozer --version
          python -c "import Cython,certifi; print('Cython:',Cython.__version__,'certifi:',certifi.__version__)"

      - name: Check fonts folder
        run: |
          if [ ! -d "./fonts" ]; then echo "::warning file=buildozer.spec::fonts文件夹缺失，中文图标会方框！"; fi
          ls -la ./fonts || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk

      - name: Upload buildozer log (always run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: ~/.buildozer/build.log
