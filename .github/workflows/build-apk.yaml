name: Android Build BiliPink
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_HOME: ${{github.workspace}}/android-sdk
  ANDROID_SDK_ROOT: ${{github.workspace}}/android-sdk
  # 最关键！强制P4A/ buildozer用这个NDK！不许自己下载！
  P4A_ANDROID_NDK: ${{github.workspace}}/android-sdk/ndk/25.2.9519653
  P4A_SDK: ${{github.workspace}}/android-sdk
  P4A_JOBS: 2
  _JAVA_OPTIONS: -Xmx2200M
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 2G Swap防OOM
        run: |
          sudo fallocate -l 2G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 一次性装好全部系统依赖
        run: |
          sudo apt update -qq
          sudo apt install -qq -y wget unzip zip openjdk-17-jdk git build-essential autoconf automake cmake libffi-dev pkg-config zlib1g-dev gettext autopoint

      - name: Setup Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pip锁定版本安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir Cython==3.0.11 buildozer==1.5.0 python-for-android==2024.05.20

      - name: 提前下载全套SDK+NDK（Buildozer不许碰下载！）
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget --timeout=180 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

          # 【超级关键】强制软链到buildozer目录！让buildozer以为它自己下载好了！骗过去！
          mkdir -p ~/.buildozer/android/platform
          ln -sfn $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

      - name: 清理buildozer残留垃圾
        run: |
          rm -rf ~/.buildozer/android/platform/build
          rm -rf ~/.buildozer/android/platform/build-dists

      - name: 开始打包！buildozer不会再去下载NDK！
        run: buildozer android debug

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: bin/*.apk
