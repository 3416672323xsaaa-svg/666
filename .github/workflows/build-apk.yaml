name: Android Build BiliPink

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
  P4A_USE_CERTIFI: '0'
  P4A_ALLOW_TLS_13: '1'
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  CYTHON_LANGUAGE_LEVEL: '3'

jobs:
  build-apk:
    name: Build BiliPink APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare build environment
        shell: bash
        run: |
          set -e
          rm -rf "$HOME/.buildozer"
          mkdir -p "$HOME/.buildozer"
          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"

      - name: Download Android SDK + Pre‑accept Licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandline-tools.zip
          unzip -q commandline-tools.zip
          mkdir -p latest
          mv cmdline-tools/* latest/

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Cache Android SDK and Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ github.workspace }}/android-sdk
          key: bilipink-sdk-v9-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            bilipink-sdk-v9-${{ runner.os }}-

      - name: Install system dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            libltdl-dev \
            zip \
            unzip \
            openjdk-17-jdk \
            git \
            pkg-config \
            libffi-dev \
            libssl-dev \
            autoconf \
            build-essential \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            gettext \
            autopoint

      - name: Install Python packages
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            'Cython==3.0.11' \
            'buildozer==1.5.0' \
            certifi
          # ✅固定develop分支，永远不会出现tag不存在！
          python -m pip install \
            'git+https://github.com/kivy/python-for-android.git@develop'

      - name: Print tool versions
        shell: bash
        run: |
          buildozer --version
          python -c "import Cython, certifi; print('Cython:', Cython.__version__); print('certifi:', certifi.__version__)"
          java -version

      - name: Check project files and fonts
        shell: bash
        run: |
          set -e
          test -f buildozer.spec || { echo "::error::buildozer.spec missing"; exit 1; }
          test -f main.py || { echo "::error::main.py missing"; exit 1; }
          if [ ! -d fonts ]; then echo "::error::fonts folder missing"; exit 1; fi
          FONT_COUNT=$(find fonts -maxdepth 2 -type f -iname '*.ttf' -o -iname '*.otf' | wc -l)
          if [ "$FONT_COUNT" -eq 0 ]; then echo "::error::fonts里面没有ttf/otf字体"; exit 1; fi
          echo "OK: Found $FONT_COUNT font file(s)"

      - name: Check Python syntax and UTF‑8
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path(".").glob("*.py"))
          if not files: raise SystemExit("No Python files")
          for f in files:
              src = f.read_text("utf-8")
              compile(src, str(f), "exec")
              print("OK", f)
          PY

      - name: Build BiliPink APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx2048m
            -XX:MaxMetaspaceSize=512m
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days:14

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-build-logs
          path: |
            ~/.buildozer/build.log
            .buildozer/android/platform/build-*/dists/*/build.log
          if-no-files-found: ignore
          retention-days:7
