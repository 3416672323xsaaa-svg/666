name: Android Build BiliPink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PYTHONIOENCODING: utf-8
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  P4A_USE_CERTIFI: 1
  P4A_ALLOW_TLS_13: 1
  P4A_HOST_PYTHON_VERSION: "3.11"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python exactly 3.11.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.10'
          architecture: x64

      - name: Setup Java 17 Temurin
        id: java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Purge stale artifacts
        run: |
          rm -rf ./bin ./build ./__pycache__
          rm -rf ~/.buildozer/.last_buildozer_check

      - name: Cache Buildozer SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bilipink-build-v03-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            bilipink-build-v03-

      - name: Install system packages
        run: |
          sudo apt update -y
          sudo apt -y install automake libltdl-dev zip unzip git pkg-config libffi-dev libssl-dev autoconf libtool cmake

      - name: Install pip tools
        run: |
          python -m pip install --upgrade pip setuptools
          pip install Cython==0.29.37 buildozer==1.6.0 certifi

      - name: Pre‑create SDK license files（绕过sdkmanager！）
        run: |
          SDK_ROOT=~/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT/licenses
          echo -n "24333f8a63b6825ea9c5514f83c2829b009d1fee" > $SDK_ROOT/licenses/android-sdk-license
          echo -n "84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_ROOT/licenses/android-sdk-preview-license
          echo -n "d975f7516a7b320925b521d9642f1347f98d40fe" > $SDK_ROOT/licenses/google-gdk-license

      - name: Version print
        run: |
          python --version
          buildozer --version

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk
