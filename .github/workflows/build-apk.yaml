name: Android Build BiliPink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  P4A_USE_CERTIFI: 1
  P4A_ALLOW_TLS_13: 1
  # 强制全局锁3.11，避免系统3.14窜进来
  P4A_HOST_PYTHON_VERSION: "3.11"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python EXACT 3.11.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.10'
          architecture: x64

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 💥 Purge old buildozer cache
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.buildozer

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bilipink-v2-${{ github.sha }}

      - name: Install system libs
        run: |
          sudo apt update -y
          sudo apt -y install automake libltdl-dev zip unzip openjdk-17-jdk git pkg-config libffi-dev libssl-dev autoconf

      - name: Install Python packages（黄金配对）
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.37 buildozer==1.6.0 certifi

      - name: Auto accept SDK licenses
        run: |
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Verify python version（看输出必须是3.11.x）
        run: |
          python --version
          buildozer --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk
