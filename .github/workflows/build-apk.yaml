name: BiliPink_OFFICIAL_IMAGE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Buildozer configuration
        run: |
          test -f buildozer.spec
          test -f main.py
          buildozer --version

      - name: Build APK
        run: buildozer android debug --log-level 2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink_FINAL
          path: bin/*.apk
          if-no-files-found: error
          compression-level: 0
