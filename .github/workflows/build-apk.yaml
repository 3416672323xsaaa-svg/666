name: BiliPink_ABSOLUTE_FIX
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PYTHONIOENCODING: utf-8
  SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
  CMDLINE_TOOLS_VER: 11076708

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python3.11.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.10'
          architecture: x64

      - name: JDK17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: FULL WIPE
        run: |
          set -e
          rm -rf ./bin ./build ./__pycache__
          rm -rf /home/runner/.buildozer
          mkdir -p "${SDK_ROOT}"

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: /home/runner/.buildozer
          key: bilipink-absolute-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            bilipink-absolute-

      - name: Install system packages
        run: |
          sudo apt update -y
          sudo apt -y install automake libltdl-dev zip unzip git pkg-config libffi-dev libssl-dev autoconf libtool cmake ant wget

      - name: Pip install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install Cython==0.29.37 buildozer==1.6.0 certifi

      - name: Prepare SDK — NO PRE-MKDIR TRICK
        run: |
          set -e
          cd "${SDK_ROOT}"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.CMDLINE_TOOLS_VER }}_latest.zip"
          # 直接解压！不要事先建cmdline-tools！zip自带这个文件夹！
          unzip -q "commandlinetools-linux-${{ env.CMDLINE_TOOLS_VER }}_latest.zip"
          # 解压完SDK_ROOT下面有个 cmdline-tools → 直接改名 latest！！
          mv cmdline-tools latest
          # 创建官方推荐目录，把latest放进去
          mkdir cmdline-tools
          mv latest cmdline-tools/
          # 【欺骗buildozer】完整复制一份latest直接叫 tools！就在SDK_ROOT根目录！
          cp -r cmdline-tools/latest tools

          # 许可文件
          mkdir -p licenses
          echo -n "24333f8a63b6825ea9c5514f83c2829b009d1fee" > licenses/android-sdk-license
          echo -n "84831b9409646a918e30573bab4c9c91346d8abd" > licenses/android-sdk-preview-license
          echo -n "d975f7516a7b320925b521d9642f1347f98d40fe" > licenses/google-gdk-license

          chmod -R u+x tools/bin
          chmod -R u+x cmdline-tools/latest/bin

          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV
          echo "${SDK_ROOT}/tools/bin" >> $GITHUB_PATH

      - name: Pre‑install SDK packages
        run: |
          set -e
          yes | sdkmanager --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: bin/*.apk
