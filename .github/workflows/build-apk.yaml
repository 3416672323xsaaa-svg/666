name: Android Build BiliPink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PYTHONIOENCODING: utf-8
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  P4A_USE_CERTIFI: 1
  P4A_ALLOW_TLS_13: 1
  P4A_HOST_PYTHON_VERSION: "3.11"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python exactly 3.11.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.10'
          architecture: x64

      - name: Setup Java 17 Temurin
        id: java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Purge stale artifacts
        run: |
          rm -rf ./bin ./build ./__pycache__
          rm -rf ~/.buildozer/.last_buildozer_check

      - name: Cache Buildozer SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bilipink-build-v03-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            bilipink-build-v03-

      - name: Install system packages
        run: |
          sudo apt update -y
          sudo apt -y install automake libltdl-dev zip unzip git pkg-config libffi-dev libssl-dev autoconf libtool cmake

      - name: Install pip tools
        run: |
          python -m pip install --upgrade pip setuptools
          pip install Cython==0.29.37 buildozer==1.6.0 certifi

      - name: Fully download Android SDK & NDK (等待全部下完)
        run: buildozer android sdk_download

      - name: Accept all SDK Licenses（带多层容错）
        run: |
          SDK=$(buildozer android sdk_path)
          TOOL1="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          TOOL2="${SDK}/cmdline-tools/bin/sdkmanager"
          if [ -f "$TOOL1" ]; then
            yes | $TOOL1 --licenses >/dev/null 2>&1 || true
          elif [ -f "$TOOL2" ]; then
            yes | $TOOL2 --licenses >/dev/null 2>&1 || true
          else
            echo "sdkmanager暂时找不到，交给buildozer内置授权处理"
          fi

      - name: Version print
        run: |
          python --version
          buildozer --version

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk
