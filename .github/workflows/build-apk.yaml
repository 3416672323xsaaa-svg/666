name: Android Build BiliPink

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
  P4A_USE_CERTIFI: '0'
  P4A_ALLOW_TLS_13: '1'
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  P4A_SDK: ${{ github.workspace }}/android-sdk
  BUILDOZER_ANDROID_SDK: ${{ github.workspace }}/android-sdk
  CYTHON_LANGUAGE_LEVEL: '3'

jobs:
  build-apk:
    name: Build BiliPink APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y automake libltdl-dev zip unzip openjdk-17-jdk git pkg-config libffi-dev libssl-dev autoconf build-essential cmake zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 gettext autopoint wget

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python packages and python-for-android develop
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'Cython==3.0.11' 'buildozer==1.5.0' certifi
          python -m pip install 'git+https://github.com/kivy/python-for-android.git@develop'

      - name: Prepare Android SDK directories and licenses
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses" "$ANDROID_HOME/cmdline-tools"
          BUI_SDK="$HOME/.buildozer/android/platform/android-sdk"
          rm -rf "$BUI_SDK"
          mkdir -p "$BUI_SDK/licenses" "$BUI_SDK/cmdline-tools"
          L1="24333f8a63b6825ea9c5514f83c2829b004d1fee"
          L2="84831b9409646a918e30573bab4c9c91346d8abd"
          L3="d975f751698a77b662f1254ddbeed3901f976be5"
          L4="813888b925a5d7c2f0bd221c1bb83411f5072c1e"
          for SDK_DIR in "$ANDROID_HOME" "$BUI_SDK"; do
            mkdir -p "$SDK_DIR/licenses"
            printf '%s\n' "$L1" > "$SDK_DIR/licenses/android-sdk-license"
            printf '%s\n' "$L2" > "$SDK_DIR/licenses/android-sdk-preview-license"
            printf '%s\n' "$L3" > "$SDK_DIR/licenses/android-sdk-license-5be876d5"
            printf '%s\n' "$L4" > "$SDK_DIR/licenses/android-sdk-license-d9534051"
          done

      - name: Download Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          cd "$TMP_DIR"
          wget -q --show-progress https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandline-tools.zip
          unzip -q commandline-tools.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -a cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          rm -rf "$TMP_DIR"

      - name: Install Android SDK packages and sync Buildozer SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          BUI_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUI_SDK"
          cp -a "$ANDROID_HOME/." "$BUI_SDK/"
          # Buildozer 1.5.0 checks the legacy tools/bin/sdkmanager path.
          mkdir -p "$BUI_SDK/tools/bin" "$ANDROID_HOME/tools/bin"
          ln -sf "$BUI_SDK/cmdline-tools/latest/bin/sdkmanager" "$BUI_SDK/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          test -x "$BUI_SDK/tools/bin/sdkmanager"
          test -d "$BUI_SDK/platforms/android-33"
          test -d "$BUI_SDK/build-tools/33.0.2"
          echo '=== Workspace SDK ==='
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/build-tools/"
          echo '=== Buildozer SDK ==='
          ls -la "$BUI_SDK/tools/bin/sdkmanager" "$BUI_SDK/build-tools/"

      - name: Print tool versions
        shell: bash
        run: |
          set -euo pipefail
          buildozer --version
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          python -m pip show python-for-android || true

      - name: Check project files and fonts folder
        shell: bash
        run: |
          set -euo pipefail
          test -f buildozer.spec || { echo '::error::buildozer.spec missing'; exit 1; }
          test -f main.py || { echo '::error::main.py missing'; exit 1; }
          test -d fonts || { echo '::error::fonts folder missing'; exit 1; }
          FONT_COUNT="$(find fonts -maxdepth 2 -type f \( -iname '*.ttf' -o -iname '*.otf' \) | wc -l)"
          if [ "$FONT_COUNT" -eq 0 ]; then echo '::error::fonts folder contains no .ttf or .otf files'; exit 1; fi
          echo "Found $FONT_COUNT font file(s)"

      - name: Check Python syntax and UTF-8
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('.').glob('*.py'))
          if not files:
              raise SystemExit('No Python source files found!')
          for f in files:
              src = f.read_text(encoding='utf-8')
              compile(src, str(f), 'exec')
              print('OK', f.name)
          PY

      - name: Build APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx2048m
            -XX:MaxMetaspaceSize=512m
        run: |
          set -euo pipefail
          buildozer android debug

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-build-logs
          path: |
            ~/.buildozer/build.log
            ~/.buildozer/android/platform/build-*/dists/*/build.log
          if-no-files-found: ignore
          retention-days: 7
