name: Build BiliPink APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      P4A_BOOTSTRAP: sdl2
      CYTHON_LANGUAGE_LEVEL: "3"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            ccache \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            patch \
            wget

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.34"
          python -m pip install "buildozer==1.5.0"

      - name: Check required project files
        run: |
          set -eu
          test -f buildozer.spec
          test -f main.py
          test -f bili_api.py
          test -f downloader.py

          echo "Required Python files are present."
          echo "Python version:"
          python --version
          echo "Java version:"
          java -version

      - name: Build BiliPink debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Create short failure report
        if: steps.build.outcome == 'failure'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          log = Path("build.log")
          text = log.read_text(errors="replace") if log.exists() else ""

          # 去除终端颜色控制字符，让日志更容易阅读
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          lines = text.splitlines()

          keywords = (
              "error:", "error ", "fatal error",
              "traceback", "command failed",
              "exception:", "out of memory",
              "no space left", "killed",
              "failed with", "not found"
          )

          hits = [
              i for i, line in enumerate(lines)
              if any(word in line.lower() for word in keywords)
          ]

          report = [
              "BiliPink APK 构建失败报告",
              f"完整日志行数：{len(lines)}",
              "",
              "=== 错误附近的日志 ===",
              ""
          ]

          if hits:
              selected = set()
              for i in hits:
                  selected.update(range(max(0, i - 5), min(len(lines), i + 9)))

              previous = -2
              for i in sorted(selected):
                  if i > previous + 1:
                      report.append("...省略...")
                  report.append(f"{i + 1}: {lines[i]}")
                  previous = i
          else:
              report.extend([
                  "没有识别到常见错误关键词。",
                  "",
                  "=== 日志末尾 160 行 ===",
                  *[
                      f"{i + 1}: {line}"
                      for i, line in enumerate(lines[-160:], start=max(0, len(lines) - 160))
                  ]
              ])

          Path("failure-report.txt").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-build-error-report
          path: |
            failure-report.txt
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail workflow if APK build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "APK build failed. Download BiliPink-build-error-report from this run's Artifacts."
          exit 1
