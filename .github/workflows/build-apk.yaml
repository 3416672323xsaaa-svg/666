name: Build BiliPink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilipink-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      P4A_USE_CERTIFI: "0"
      CYTHON_LANGUAGE_LEVEL: "3"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.parallel=false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y             build-essential git zip unzip wget curl             autoconf automake libtool pkg-config             cmake ninja-build ccache             libffi-dev libssl-dev zlib1g-dev             libncurses5-dev libncursesw5-dev libtinfo6 gettext

      - name: Install Buildozer and pinned python-for-android
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git "$RUNNER_TEMP/python-for-android"
          echo "P4A_SOURCE_DIR=$RUNNER_TEMP/python-for-android" >> "$GITHUB_ENV"

      - name: Prepare Buildozer SDK and legacy sdkmanager path
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK/cmdline-tools"

          TMP="$(mktemp -d)"
          cd "$TMP"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a cmdline-tools/. "$SDK/cmdline-tools/latest/"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -f "$SDKMANAGER"

          # Buildozer 1.5.0 looks for the legacy tools/bin/sdkmanager path.
          # Link that expected path to the modern command-line tools.
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          # Accept licenses and install the exact packages before Buildozer runs.
          yes | bash "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          bash "$SDKMANAGER" --sdk_root="$SDK"             "platform-tools"             "platforms;android-33"             "build-tools;33.0.2"

          test -x "$SDK/tools/bin/sdkmanager"
          test -x "$SDK/platform-tools/adb"
          test -d "$SDK/platforms/android-33"
          test -x "$SDK/build-tools/33.0.2/aidl"

      - name: Configure build without changing the repository Spec
        shell: bash
        run: |
          set -euxo pipefail
          test -f buildozer.spec
          test -f main.py
          python -m py_compile main.py

          # Apply this only inside the temporary GitHub runner workspace.
          # The committed buildozer.spec in your repository is not changed.
          sed -i '/^\[app\]/a p4a.source_dir = '"$P4A_SOURCE_DIR" buildozer.spec
          grep -F "p4a.source_dir = $P4A_SOURCE_DIR" buildozer.spec

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
