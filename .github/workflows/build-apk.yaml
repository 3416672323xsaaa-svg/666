name: Android Build BiliPink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  P4A_USE_CERTIFI: 1
  P4A_ALLOW_TLS_13: 1
  # ❗删掉PIP_INDEX_URL = 彻底不用国内镜像

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 💥 Purge old buildozer cache FIRST
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.buildozer

      - name: Cache fresh Buildozer SDK & NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bilipink-auto-${{ github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt -y install automake libltdl-dev zip unzip openjdk-17-jdk git pkg-config libffi-dev libssl-dev autoconf

      - name: Install python packages (official PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install Cython==3.0.11 buildozer==1.6.1 certifi

      - name: Auto accept SDK licenses
        run: |
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Print versions
        run: |
          buildozer --version
          python -c "import Cython,certifi; print('Cython:',Cython.__version__,'certifi:',certifi.__version__)"

      - name: Check fonts folder
        run: |
          if [ ! -d "./fonts" ]; then echo "::warning file=buildozer.spec::fonts文件夹缺失，中文会方框！"; fi
          ls -la ./fonts || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk
