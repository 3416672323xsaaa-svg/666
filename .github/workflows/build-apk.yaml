name: Android Build BiliPink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  P4A_SDK: ${{ github.workspace }}/android-sdk
  P4A_PYTHON_VERSION: "3.11"
  P4A_JOBS: "2"
  P4A_USE_CERTIFI: '0'
  P4A_ALLOW_TLS_13: '1'
  CYTHON_LANGUAGE_LEVEL: '3'
  _JAVA_OPTIONS: "-Xmx2048m"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2048m"

jobs:
  build-apk:
    name: Build BiliPink APK
    runs-on: ubuntu-22.04
    timeout-minutes: 210

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: ✅自动清理全部旧build残留 + 释放内存（代替手动删缓存）
        shell: bash
        run: |
          set -e
          echo "=== Wipe old buildozer / SDK / temp ==="
          rm -rf "$HOME/.buildozer"
          rm -rf "$ANDROID_HOME"
          rm -rf /tmp/*
          rm -rf ~/.cache/*
          free -h

      - name: Install system dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y automake libltdl-dev zip unzip openjdk-17-jdk git pkg-config libffi-dev libssl-dev autoconf build-essential cmake zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 gettext autopoint wget

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare SDK dir + all licenses + legacy symlink
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/licenses" "$ANDROID_HOME/cmdline-tools"
          BUI_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUI_SDK/licenses" "$BUI_SDK/cmdline-tools"

          L1="24333f8a63b6825ea9c5514f83c2829b004d1fee"
          L2="84831b9409646a918e30573bab4c9c91346d8abd"
          L3="d975f751698a77b662f1254ddbeed3901f976be5"
          L4="813888b925a5d7c2f0bd221c1bb83411f5072c1e"

          for D in "$ANDROID_HOME" "$BUI_SDK"; do
            echo "$L1" > "$D/licenses/android-sdk-license"
            echo "$L2" > "$D/licenses/android-sdk-preview-license"
            echo "$L3" > "$D/licenses/android-sdk-license-5be876d5"
            echo "$L4" > "$D/licenses/android-sdk-license-d9534051"
          done

      - name: Download commandline‑tools
        shell: bash
        run: |
          set -e
          cd "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm *.zip
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install exact SDK + NDK r25.2.9519653 + sync to buildozer folder
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          BUI_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUI_SDK"
          cp -r "$ANDROID_HOME"/. "$BUI_SDK/"
          mkdir -p "$BUI_SDK/tools/bin"
          ln -sf "$BUI_SDK/cmdline-tools/latest/bin/sdkmanager" "$BUI_SDK/tools/bin/sdkmanager"
          echo "=== Memory after SDK install ==="
          free -h

      - name: Install locked pip + fixed p4a commit
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip==26.2.1 setuptools==72.2.0 wheel==0.43.0
          python -m pip install 'Cython==3.0.11' 'buildozer==1.5.0' certifi
          python -m pip install git+https://github.com/kivy/python-for-android.git@5311828

      - name: Final free memory check
        shell: bash
        run: |
          free -h
          df -h

      - name: Build APK
        shell: bash
        run: |
          set -e
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk
          retention-days: 14

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-logs
          path: |
            ~/.buildozer/build.log
            ~/.buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
