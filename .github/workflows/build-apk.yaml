name: BiliPink_DOCKER_ONEHIT
on:
  push:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # 现成封好的Buildozer镜像，环境全部焊死！不需要手动装SDK/p4a！
      - name: Build APK via prebuilt buildozer container
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_command: android debug
          # 镜像内锁死：buildozer1.5.0 + p4a v2023.09.04 + NDK25b + python3.10
          python_version: '3.10'

      - name: Download result APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink_APK
          path: bin/*.apk
