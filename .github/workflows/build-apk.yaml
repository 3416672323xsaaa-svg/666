name: Android Build BiliPink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  P4A_SDK: ${{ github.workspace }}/android-sdk
  P4A_JOBS: "2"
  _JAVA_OPTIONS: "-Xmx2048m"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-apk:
    name: Build BiliPink APK
    runs-on: ubuntu-22.04
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Full reset + 2G swap
        shell: bash
        run: |
          set +e
          rm -rf "$HOME/.buildozer" "$ANDROID_HOME" ~/.cache/pip ~/.cache/pip-ephem-wheel-cache ~/.cache/pip-tools
          sudo fallocate -l 2G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          set -e

      - name: Apt deps
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y automake zip unzip openjdk-17-jdk git pkg-config libffi-dev libssl-dev autoconf build-essential cmake zlib1g-dev gettext autopoint wget

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pip install with PyPI mirror and longer timeout
        shell: bash
        run: |
          python -m pip config set global.index-url https://pypi.org/simple/
          python -m pip config set global.trusted-host pypi.org
          python -m pip install --default-timeout=120 --retries 5 --upgrade pip
          python -m pip install --default-timeout=120 --retries 5 Cython==3.0.11 buildozer==1.5.0
          python -m pip install --default-timeout=120 --retries 5 python-for-android

      - name: SDK folder + licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses" "$ANDROID_HOME/cmdline-tools"
          BUI_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUI_SDK/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          cp -r "$ANDROID_HOME/licenses" "$BUI_SDK/"

      - name: Get cmdline tools
        shell: bash
        run: |
          cd "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm -f cmdline-tools.zip
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: SDK + NDK install
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          BUI_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUI_SDK"
          cp -r "$ANDROID_HOME"/. "$BUI_SDK/"

      - name: Sanity check
        shell: bash
        run: |
          buildozer --version
          p4a --version
          java -version

      - name: Build APK
        shell: bash
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk
          retention-days: 14

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-logs
          path: |
            ~/.buildozer/build.log
            ~/.buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
