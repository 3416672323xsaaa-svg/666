name: Build BiliPink APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      P4A_BOOTSTRAP: sdl2
      CYTHON_LANGUAGE_LEVEL: "3"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            ccache \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            patch \
            wget

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.34"
          python -m pip install "buildozer==1.5.0"

      - name: Check project files
        run: |
          set -eu
          test -f buildozer.spec
          test -f main.py
          test -f bili_api.py
          test -f downloader.py

          echo "Required project files are present."
          echo "Python version:"
          python --version
          echo "Java version:"
          java -version

      - name: Build BiliPink debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Create failure report
        if: steps.build.outcome == 'failure'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          log_path = Path("build.log")
          content = log_path.read_text(
              encoding="utf-8", errors="replace"
          ) if log_path.exists() else ""

          content = re.sub(
              r'\x1b\[[0-9;]*[A-Za-z]', '', content
          )
          lines = content.splitlines()

          keywords = (
              "error:", "fatal error", "traceback",
              "command failed", "exception:",
              "out of memory", "no space left",
              "killed", "failed with", "not found",
              "undefined reference"
          )

          matches = [
              i for i, line in enumerate(lines)
              if any(word in line.lower() for word in keywords)
          ]

          report = [
              "BiliPink APK 构建失败报告",
              f"完整日志行数：{len(lines)}",
              ""
          ]

          if matches:
              selected = set()
              for i in matches:
                  selected.update(
                      range(max(0, i - 5), min(len(lines), i + 9))
                  )

              report.append("=== 错误附近的日志 ===")
              previous = -2

              for i in sorted(selected):
                  if i > previous + 1:
                      report.append("...省略...")
                  report.append(f"{i + 1}: {lines[i]}")
                  previous = i
          else:
              report.append("未识别到常见错误关键词。")
              report.append("=== 日志末尾 200 行 ===")
              start = max(0, len(lines) - 200)

              for i in range(start, len(lines)):
                  report.append(f"{i + 1}: {lines[i]}")

          Path("failure-report.txt").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-build-error-report
          path: |
            failure-report.txt
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Mark build as failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "APK build failed."
          echo "Download BiliPink-build-error-report from Artifacts."
          exit 1
