name: BiliPink_Final_NoMoreBug
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PYTHONIOENCODING: utf-8
  SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
  CMDLINE_TOOLS_VER: 11076708

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.10'
          architecture: x64

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: WIPE ALL OLD TRASH
        run: |
          set -e
          rm -rf ./bin ./build ./__pycache__
          rm -rf /home/runner/.buildozer
          mkdir -p $SDK_ROOT

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: /home/runner/.buildozer
          key: bilipink-realfinal-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            bilipink-realfinal-

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt -y install automake libltdl-dev zip unzip git pkg-config libffi-dev libssl-dev autoconf libtool cmake ant wget

      - name: Install python packages
        run: |
          python -m pip install --upgrade pip setuptools
          pip install Cython==0.29.37 buildozer==1.6.0 certifi

      - name: Prepare SDK (temp folder + fake tools copy)
        run: |
          set -e
          cd $SDK_ROOT
          # 下载到当前SDK根目录
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-${{ env.CMDLINE_TOOLS_VER }}_latest.zip
          # 先解压到临时tmp文件夹，彻底避开名字冲突！！！
          mkdir tmp
          cd tmp
          unzip -q ../commandlinetools-linux-${{ env.CMDLINE_TOOLS_VER }}_latest.zip
          # tmp里面得到cmdline-tools，把它移出去叫latest
          mv cmdline-tools $SDK_ROOT/cmdline-tools
          cd $SDK_ROOT
          rm -rf tmp
          mv cmdline-tools cmdline-tools/latest
          # 最关键！复制一份，名字=tools，专门哄buildozer！！不是mv！是cp！
          cp -r cmdline-tools/latest tools

          # 写入全部许可
          mkdir -p $SDK_ROOT/licenses
          echo -n "24333f8a63b6825ea9c5514f83c2829b009d1fee" > $SDK_ROOT/licenses/android-sdk-license
          echo -n "84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_ROOT/licenses/android-sdk-preview-license
          echo -n "d975f7516a7b320925b521d9642f1347f98d40fe" > $SDK_ROOT/licenses/google-gdk-license

          chmod -R u+x $SDK_ROOT/tools/bin
          chmod -R u+x $SDK_ROOT/cmdline-tools/latest/bin

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/tools/bin" >> $GITHUB_PATH

      - name: Pre‑download SDK components
        run: |
          set -e
          yes | sdkmanager --sdk_root=$SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: bin/*.apk
