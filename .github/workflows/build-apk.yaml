name: Build BiliPink APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      P4A_BOOTSTRAP: sdl2
      CYTHON_LANGUAGE_LEVEL: "3"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf automake autopoint libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake ccache libffi-dev libssl-dev \
            libltdl-dev gettext patch wget

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.34" "buildozer==1.5.0"

      - name: Check project files
        run: |
          set -eu
          test -f buildozer.spec
          test -f main.py
          test -f bili_api.py
          test -f downloader.py
          echo "All required project files found."

      - name: Build APK and capture log
        id: build
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          echo "build_exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Print error details directly in Actions
        if: steps.build.outcome == 'failure'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path("build.log")
          raw = p.read_text(errors="replace") if p.exists() else ""
          raw = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw)
          lines = raw.splitlines()

          keys = (
              "error:", "fatal error", "traceback",
              "command failed", "exception:",
              "out of memory", "no space left",
              "killed", "undefined reference",
              "failed to", "not found",
              "could not", "unable to"
          )

          hits = [
              i for i, line in enumerate(lines)
              if any(k in line.lower() for k in keys)
          ]

          print("========== BILIPINK BUILD ERROR REPORT ==========")
          print("Total log lines:", len(lines))
          print("Matching error lines:", len(hits))

          if hits:
              chosen = set()
              for i in hits:
                  chosen.update(range(max(0, i-3), min(len(lines), i+6)))

              last = -2
              for i in sorted(chosen):
                  if i > last + 1:
                      print("... omitted ...")
                  print(f"{i+1}: {lines[i]}")
                  last = i
          else:
              print("No common error keywords detected.")
              print("Showing final 160 log lines:")
              start = max(0, len(lines)-160)
              for i in range(start, len(lines)):
                  print(f"{i+1}: {lines[i]}")

          print("========== END BUILD ERROR REPORT ==========")

          report = Path("failure-report.txt")
          report.write_text(
              "\n".join(
                  f"{i+1}: {line}"
                  for i, line in enumerate(lines)
              ),
              encoding="utf-8"
          )
          PY

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-build-error-report
          path: |
            failure-report.txt
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Finish with correct build status
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          if [ "$BUILD_RESULT" = "success" ]; then
            echo "BiliPink APK build succeeded."
          else
            echo "::error::BiliPink APK build failed. The error details were printed in the previous step."
            exit 1
          fi
