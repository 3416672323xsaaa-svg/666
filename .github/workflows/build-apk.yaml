name: Android Build BiliPink

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
  P4A_USE_CERTIFI: '0'
  P4A_ALLOW_TLS_13: '1'
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  # 新增：强制p4a读取同一个SDK路径
  P4A_SDK: ${{ github.workspace }}/android-sdk
  BUILDOZER_ANDROID_SDK: ${{ github.workspace }}/android-sdk
  CYTHON_LANGUAGE_LEVEL: '3'

jobs:
  build-apk:
    name: Build BiliPink APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies FIRST
        shell: bash
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y \
            automake \
            libltdl-dev \
            zip \
            unzip \
            openjdk-17-jdk \
            git \
            pkg-config \
            libffi-dev \
            libssl-dev \
            autoconf \
            build-essential \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            gettext \
            autopoint \
            wget

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare folders + ALL license hashes (NO yes pipe!)
        shell: bash
        run: |
          set -e
          rm -rf "$HOME/.buildozer"
          mkdir -p "$HOME/.buildozer"
          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          # Buildozer / p4a 偷偷自己用的私有SDK目录（之前缺失）
          BUI_SDK="$HOME/.buildozer/android/platform/android-sdk"
          rm -rf "$BUI_SDK"
          mkdir -p "$BUI_SDK/licenses"
          mkdir -p "$BUI_SDK/cmdline-tools"

          L1="24333f8a63b6825ea9c5514f83c2829b004d1fee"
          L2="84831b9409646a918e30573bab4c9c91346d8abd"
          L3="d975f751698a77b662f1254ddbeed3901f976be5"
          L4="813888b925a5d7c2f0bd221c1bb83411f5072c1e"

          # 主SDK写入许可
          echo "$L1" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "$L2" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "$L3" > "$ANDROID_HOME/licenses/android-sdk-license-5be876d5"
          echo "$L4" > "$ANDROID_HOME/licenses/android-sdk-license-d9534051"

          # Buildozer私有SDK同步写入完全一样许可
          echo "$L1" > "$BUI_SDK/licenses/android-sdk-license"
          echo "$L2" > "$BUI_SDK/licenses/android-sdk-preview-license"
          echo "$L3" > "$BUI_SDK/licenses/android-sdk-license-5be876d5"
          echo "$L4" > "$BUI_SDK/licenses/android-sdk-license-d9534051"

      - name: Download SDK cmdline tools
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandline-tools.zip
          unzip -q commandline-tools.zip
          mv cmdline-tools latest
          rm -f commandline-tools.zip
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install ONLY exactly what we need ❗REMOVED yes |
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --sdk_root="$ANDROID_HOME" --verbose \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          rm -rf "$ANDROID_HOME/build-tools/37.0.0"
          rm -rf "$ANDROID_HOME/platforms/android-13"

          # ✅关键一步：把整套装好的SDK完整复制到buildozer私有目录，阻止它自行下载
          cp -r "$ANDROID_HOME"/* "$HOME/.buildozer/android/platform/android-sdk/"

          # 二次清扫私有路径里意外出现的37版本
          rm -rf "$HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0"

          ls -la "$ANDROID_HOME/build-tools/"
          ls -la "$HOME/.buildozer/android/platform/android-sdk/build-tools/"

      - name: Cache SDK + Buildozer (KEY v18 — MUST CLEAR OLD CACHE!)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ github.workspace }}/android-sdk
          key: bilipink-sdk-v18-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            bilipink-sdk-v18-${{ runner.os }}-

      - name: Install Python packages & p4a develop
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            'Cython==3.0.11' \
            'buildozer==1.5.0' \
            certifi
          python -m pip install \
            'git+https://github.com/kivy/python-for-android.git@develop'

      - name: Print versions
        shell: bash
        run: |
          buildozer --version
          java -version
          sdkmanager --version
          echo "=== Main SDK build-tools ==="
          ls "$ANDROID_HOME/build-tools/"
          echo "=== Buildozer internal SDK build-tools ==="
          ls "$HOME/.buildozer/android/platform/android-sdk/build-tools/"

      - name: Check project files and fonts folder
        shell: bash
        run: |
          set -e
          test -f buildozer.spec || { echo "::error::buildozer.spec missing"; exit 1; }
          test -f main.py || { echo "::error::main.py missing"; exit 1; }
          if [ ! -d fonts ]; then echo "::error::fonts folder missing"; exit 1; fi
          FONT_COUNT=$(find fonts -maxdepth 2 -type f -iname '*.ttf' -o -iname '*.otf' | wc -l)
          if [ "$FONT_COUNT" -eq 0 ]; then echo "::error::fonts里面没有ttf/otf字体"; exit 1; fi
          echo "✅ OK: Found $FONT_COUNT font file(s)"

      - name: Check *.py syntax UTF‑8
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path(".").glob("*.py"))
          if not files: raise SystemExit("No Python source files found!")
          for f in files:
              src = f.read_text("utf-8")
              compile(src, str(f), "exec")
              print("OK", f.name)
          PY

      - name: Build APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx2048m
            -XX:MaxMetaspaceSize=512m
        run: |
          buildozer android debug --android-sdk "$ANDROID_HOME"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload all logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-build-logs
          path: |
            ~/.buildozer/build.log
            ~/.buildozer/android/platform/build-*/dists/*/build.log
          if-no-files-found: ignore
          retention-days: 7
