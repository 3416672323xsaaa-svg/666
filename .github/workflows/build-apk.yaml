name: BiliPink Final Build
on:
  push:
    branches: [ main ]

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PYTHONIOENCODING: utf-8
  SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
  CMDLINE_TOOLS: 9477386
  P4A_COMMIT: 2450e70522057403d87465983523271044964915

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Python 3.10.13（固定死，不许3.11）
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"
          architecture: x64

      - name: JDK‑17 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Wipe EVERY old cache leftover
        run: |
          set -e
          rm -rf bin build .buildozer __pycache__
          rm -rf /home/runner/.buildozer
          mkdir -p "${SDK_ROOT}"

      - name: Install all system deps（一套不多一套不少）
        run: |
          sudo apt update -y
          sudo apt install -y git wget unzip zip ant autoconf automake libtool pkg-config libffi-dev libssl-dev cmake

      - name: Lock pip packages
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36 buildozer==1.5.0 certifi

      - name: Install SDK + tools copy（这套路径无数次验证）
        run: |
          set -e
          cd "${SDK_ROOT}"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-${{ env.CMDLINE_TOOLS }}_latest.zip
          unzip -q commandlinetools-linux-${{ env.CMDLINE_TOOLS }}_latest.zip
          mkdir -p cmdline-tools
          mv cmdline-tools latest
          mkdir cmdline-tools
          mv latest cmdline-tools/
          cp -r cmdline-tools/latest tools

          mkdir -p licenses
          echo "24333f8a63b6825ea9c5514f83c2829b009d1fee" > licenses/android-sdk-license

          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV
          echo "${SDK_ROOT}/tools/bin:${SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: sdkmanager pull exact versions
        run: |
          yes | sdkmanager --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-32" "build-tools;32.0.0" "ndk;25.2.9519653"

      - name: Pre‑fetch python‑for‑android & lock commit（最关键一步，不让buildozer自动拉最新）
        run: |
          set -e
          git clone https://github.com/kivy/python-for-android.git /home/runner/.buildozer/android/platform/python-for-android
          cd /home/runner/.buildozer/android/platform/python-for-android
          git checkout ${{ env.P4A_COMMIT }}

      - name: Patch buildozer.spec（不要自己手改冲突！让脚本写入）
        run: |
          echo "p4a.source_dir = /home/runner/.buildozer/android/platform/python-for-android" >> buildozer.spec
          echo "android.api = 32" >> buildozer.spec
          echo "android.ndk = 25.2.9519653" >> buildozer.spec
          echo "requirements = python3==3.10.13,kivy==2.2.1,kivymd==1.2.0,requests" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec

      - name: Build APK --log-level=2
        run: buildozer android debug --log-level=2

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-apk
          path: bin/*.apk
