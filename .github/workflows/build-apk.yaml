name: Android Build BiliPink
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_HOME: ${{github.workspace}}/android-sdk
  ANDROID_SDK_ROOT: ${{github.workspace}}/android-sdk
  P4A_ANDROID_NDK: ${{github.workspace}}/android-sdk/ndk/25.2.9519653
  P4A_SDK: ${{github.workspace}}/android-sdk
  P4A_JOBS: 2
  _JAVA_OPTIONS: -Xmx2200M
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # ✅ swap放到工作区！再也不动 / 目录！不会权限报错！
      - name: Enable Swap
        run: |
          SWAPIMG="${GITHUB_WORKSPACE}/swap.img"
          rm -f "$SWAPIMG"
          dd if=/dev/zero of="$SWAPIMG" bs=1M count=2048 status=none
          chmod 600 "$SWAPIMG"
          mkswap "$SWAPIMG"
          sudo swapon "$SWAPIMG" || true

      - name: Install system packages
        run: |
          sudo apt update -qq
          sudo apt install -qq -y wget unzip zip openjdk-17-jdk git build-essential autoconf automake cmake libffi-dev pkg-config zlib1g-dev gettext autopoint

      - name: Setup Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pip install fixed
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir Cython==3.0.11 buildozer==1.5.0 python-for-android==2024.05.20

      - name: Pre‑fetch SDK+NDK + trick buildozer path
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget --timeout=180 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

          mkdir -p ~/.buildozer/android/platform
          ln -sfn $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

      - name: Clean old build trash
        run: |
          rm -rf ~/.buildozer/android/platform/build
          rm -rf ~/.buildozer/android/platform/build-dists

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: bin/*.apk
