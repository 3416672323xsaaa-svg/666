name: Android Build BiliPink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Buildozer SDK & NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v3-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt -y install automake libltdl-dev zip unzip openjdk-17-jdk git pkg-config libffi-dev libssl-dev

      - name: Install python packages (含Cython！)
        run: |
          python -m pip install --upgrade pip
          pip install Cython==3.0.11 buildozer==1.5.0

      - name: Show buildozer / cython version
        run: |
          buildozer --version
          python -c "import Cython;print('Cython ok',Cython.__version__)"

      - name: Debug build APK
        run: |
          buildozer android debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilipink-debug-apk
          path: bin/*.apk
